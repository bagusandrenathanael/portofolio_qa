<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Actionable QA bug report</title><desc id="desc">Illustration of a structured defect report with reproduction steps, expected and actual outcomes, and evidence.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#fff0e7"/><stop offset="1" stop-color="#ffe6dc"/></linearGradient></defs>
  <rect width="1200" height="600" rx="30" fill="url(#bg)"/><circle cx="100" cy="100" r="150" fill="#fff" opacity=".45"/><circle cx="1090" cy="500" r="180" fill="#fff" opacity=".3"/>
  <rect x="90" y="64" width="1020" height="472" rx="26" fill="#fff" stroke="#f0d9cf" stroke-width="3"/>
  <text x="142" y="128" fill="#442d2b" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700">A BUG REPORT THAT MOVES A FIX FORWARD</text><text x="142" y="164" fill="#8a716b" font-family="Inter,Arial,sans-serif" font-size="18">Reproducible steps · expected vs actual · useful evidence</text>
  <g transform="translate(145 212)"><rect width="565" height="275" rx="18" fill="#fffaf8" stroke="#efddd6" stroke-width="3"/><rect width="565" height="54" rx="18" fill="#fff3ed"/><path d="M0 54h565" stroke="#efddd6" stroke-width="2"/><circle cx="30" cy="27" r="10" fill="#d35b3c"/><text x="58" y="34" fill="#553a35" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700">[API] Catalog item is missing an id</text>
  <text x="28" y="94" fill="#a06a5a" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700">REPRODUCTION STEPS</text><rect x="28" y="108" width="320" height="18" rx="9" fill="#f0e5e1"/><rect x="28" y="138" width="275" height="18" rx="9" fill="#f0e5e1"/><rect x="28" y="168" width="298" height="18" rx="9" fill="#f0e5e1"/>
  <rect x="28" y="207" width="230" height="46" rx="12" fill="#e9f7f0"/><text x="47" y="236" fill="#277b59" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700">EXPECTED · id is present</text><rect x="273" y="207" width="264" height="46" rx="12" fill="#fff0e8"/><text x="290" y="236" fill="#b95337" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700">ACTUAL · id is missing</text></g>
  <g transform="translate(795 230)"><rect width="220" height="176" rx="20" fill="#f3f7fc" stroke="#dce6f2" stroke-width="3"/><rect x="24" y="23" width="172" height="32" rx="10" fill="#e1ecfb"/><text x="39" y="45" fill="#315990" font-family="monospace" font-size="14">HTTP 200 · DEMO</text><path d="M30 80h158m-158 27h126m-126 27h141" stroke="#c9d5e4" stroke-width="10" stroke-linecap="round"/><circle cx="180" cy="154" r="18" fill="#f8ddd4"/><path d="M180 144v12m0 7v1" stroke="#bb573e" stroke-width="4" stroke-linecap="round"/><rect x="-15" y="198" width="250" height="54" rx="16" fill="#fff1eb"/><path d="M18 225h24m-12-12v24" stroke="#c45b3d" stroke-width="4" stroke-linecap="round"/><text x="57" y="232" fill="#794b3f" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700">SANITIZED EVIDENCE</text></g>
</svg>
