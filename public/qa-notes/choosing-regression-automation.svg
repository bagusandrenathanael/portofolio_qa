<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Maintainable regression automation</title><desc id="desc">Illustration of a browser test connected to reusable page actions and verified outcomes.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#e7f7f1"/><stop offset="1" stop-color="#d9f0e8"/><stop stop-color="#fff" offset=".5"/></linearGradient></defs>
  <rect width="1200" height="600" rx="30" fill="url(#bg)"/><circle cx="1050" cy="100" r="155" fill="#fff" opacity=".48"/>
  <rect x="90" y="70" width="1020" height="460" rx="26" fill="#fff" stroke="#d5e8e1" stroke-width="3"/>
  <text x="140" y="132" fill="#1a3a36" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700">REPEATABLE CHECKS · CLEAR SIGNALS</text><text x="140" y="168" fill="#718a84" font-family="Inter,Arial,sans-serif" font-size="18">Automate stable, high-value user journeys</text>
  <g transform="translate(145 218)"><rect width="465" height="235" rx="18" fill="#f6f9fc" stroke="#dbe4ee" stroke-width="3"/><path d="M0 48h465" stroke="#dbe4ee" stroke-width="3"/><circle cx="28" cy="24" r="7" fill="#ef806d"/><circle cx="53" cy="24" r="7" fill="#efbd59"/><circle cx="78" cy="24" r="7" fill="#57bd91"/><rect x="27" y="76" width="156" height="130" rx="12" fill="#fff" stroke="#e1e8f0" stroke-width="2"/><rect x="47" y="97" width="116" height="15" rx="7" fill="#dce9fa"/><rect x="47" y="124" width="116" height="13" rx="6" fill="#e8eef6"/><rect x="47" y="151" width="116" height="13" rx="6" fill="#e8eef6"/><rect x="47" y="177" width="75" height="18" rx="9" fill="#315c9a"/><text x="224" y="105" fill="#263950" font-family="monospace" font-size="18">test("login flow", async ({ page }) =&gt; {</text><text x="244" y="143" fill="#14805b" font-family="monospace" font-size="17">await page.goto(baseUrl);</text><text x="244" y="178" fill="#14805b" font-family="monospace" font-size="17">await expect(overview).toBeVisible();</text><text x="224" y="210" fill="#263950" font-family="monospace" font-size="18">});</text></g>
  <g transform="translate(700 232)"><path d="M0 93h92m100 0h82" fill="none" stroke="#73bba0" stroke-width="6" stroke-linecap="round"/><circle cx="0" cy="93" r="12" fill="#55b78d"/><circle cx="192" cy="93" r="12" fill="#55b78d"/><circle cx="274" cy="93" r="12" fill="#55b78d"/><rect x="30" y="38" width="142" height="112" rx="18" fill="#eff8f4" stroke="#cce8dc" stroke-width="3"/><text x="101" y="82" fill="#52766b" font-family="Inter,Arial,sans-serif" font-size="14" text-anchor="middle">PAGE OBJECT</text><text x="101" y="110" fill="#1b5845" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle">Reusable actions</text><rect x="220" y="38" width="142" height="112" rx="18" fill="#eff8f4" stroke="#cce8dc" stroke-width="3"/><circle cx="291" cy="78" r="20" fill="#15986d"/><path d="m282 78 7 7 13-15" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="291" y="126" fill="#1b5845" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle">Verified outcome</text><rect x="0" y="180" width="362" height="52" rx="16" fill="#f3f7fc"/><text x="181" y="213" fill="#526981" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle">EXPLORE NEW BEHAVIOR MANUALLY</text></g>
</svg>
