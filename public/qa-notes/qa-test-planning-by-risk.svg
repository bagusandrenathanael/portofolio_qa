<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Risk-based QA test planning</title><desc id="desc">Illustration of a likelihood and impact matrix highlighting critical test priorities.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#edf4ff"/><stop offset="1" stop-color="#dce9ff"/></linearGradient><linearGradient id="card" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f7faff"/></linearGradient></defs>
  <rect width="1200" height="600" rx="30" fill="url(#bg)"/><circle cx="1040" cy="95" r="150" fill="#fff" opacity=".42"/><circle cx="145" cy="520" r="165" fill="#fff" opacity=".28"/>
  <rect x="96" y="62" width="1008" height="476" rx="26" fill="url(#card)" stroke="#d6e2f3" stroke-width="3"/>
  <text x="145" y="124" fill="#1b3156" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700">PRIORITIZE BY RISK</text><text x="145" y="160" fill="#71809a" font-family="Inter,Arial,sans-serif" font-size="18">Likelihood × impact guides coverage</text>
  <g transform="translate(200 198)"><rect width="530" height="280" rx="14" fill="#f7f9fd" stroke="#dce5f1" stroke-width="2"/><path d="M176.6 0v280M353.3 0v280M0 93.3h530M0 186.6h530" stroke="#dce5f1" stroke-width="2"/>
    <rect x="354" y="1" width="174" height="91" rx="12" fill="#ffe6df"/><rect x="354" y="95" width="174" height="89" rx="12" fill="#fff1dc"/><rect x="178" y="188" width="174" height="90" rx="12" fill="#fff4df"/>
    <text x="265" y="64" fill="#8290a7" font-family="Inter,Arial,sans-serif" font-size="16" text-anchor="middle">LOW</text><text x="440" y="54" fill="#bd4c35" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle">HIGH PRIORITY</text><text x="440" y="146" fill="#a16a22" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle">REVIEW</text>
    <text x="-108" y="-20" transform="rotate(-90)" fill="#667690" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600">LIKELIHOOD</text><text x="219" y="316" fill="#667690" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600">IMPACT</text>
    <circle cx="442" cy="47" r="18" fill="#d94f38"/><path d="m433 47 6 6 12-13" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(805 240)"><circle cx="76" cy="70" r="60" fill="#e9f1ff"/><path d="M76 35v38l28 17" fill="none" stroke="#315c9a" stroke-width="9" stroke-linecap="round"/><circle cx="76" cy="70" r="37" fill="none" stroke="#315c9a" stroke-width="7"/><rect x="0" y="165" width="250" height="54" rx="16" fill="#e9f7f0"/><path d="m24 192 10 10 20-23" fill="none" stroke="#12946a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="68" y="200" fill="#176f54" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700">TRACE THE EVIDENCE</text></g>
